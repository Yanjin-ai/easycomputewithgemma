<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a"/>
      <stop offset="100%" style="stop-color:#0d1626"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4285f4"/>
      <stop offset="50%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#60a5fa"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
    <linearGradient id="nodeGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1d3557"/>
      <stop offset="100%" style="stop-color:#112240"/>
    </linearGradient>
    <linearGradient id="nodeGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2e1a6e"/>
      <stop offset="100%" style="stop-color:#1a0f42"/>
    </linearGradient>
    <linearGradient id="nodeGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#064e3b"/>
      <stop offset="100%" style="stop-color:#022c22"/>
    </linearGradient>
    <linearGradient id="nodeGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#431407"/>
      <stop offset="100%" style="stop-color:#27100a"/>
    </linearGradient>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#60a5fa"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrowReturn" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#4ade80"/>
    </marker>
    <filter id="nodeGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="titleGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Subtle grid -->
  <g opacity="0.05" stroke="#4285f4" stroke-width="0.5">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accentGrad)"/>

  <!-- Ambient glow blobs -->
  <circle cx="200" cy="320" r="220" fill="#4285f4" opacity="0.04"/>
  <circle cx="1000" cy="380" r="200" fill="#7c3aed" opacity="0.05"/>
  <circle cx="600" cy="430" r="150" fill="#22c55e" opacity="0.04"/>

  <!-- ═══════════════════════════════════════════ -->
  <!-- HEADER SECTION -->
  <!-- ═══════════════════════════════════════════ -->

  <!-- Title shadow/glow layer -->
  <text x="100" y="130" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif"
        font-size="86" font-weight="800" fill="#4285f4" opacity="0.12" letter-spacing="-3">EasyCompute</text>
  <!-- Title -->
  <text x="100" y="130" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif"
        font-size="86" font-weight="800" fill="white" letter-spacing="-3">EasyCompute</text>

  <!-- Subtitle -->
  <text x="104" y="172" font-family="-apple-system,BlinkMacSystemFont,sans-serif"
        font-size="27" font-weight="300" fill="#94a3b8" letter-spacing="0.3">Personal AI That Never Leaves Your Home Network</text>

  <!-- Badge row -->
  <!-- Gemma 4 badge -->
  <rect x="104" y="196" width="155" height="36" rx="18" fill="#132038" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="124" cy="214" r="7" fill="#3b82f6"/>
  <text x="138" y="219" font-family="-apple-system,BlinkMacSystemFont,sans-serif"
        font-size="15" font-weight="700" fill="#93c5fd">Gemma 4 E2B/E4B</text>

  <!-- via text -->
  <text x="267" y="219" font-family="-apple-system,sans-serif" font-size="15" fill="#4b5563">via</text>

  <!-- LiteRT badge -->
  <rect x="295" y="196" width="135" height="36" rx="18" fill="#052e16" stroke="#16a34a" stroke-width="1.5"/>
  <circle cx="315" cy="214" r="7" fill="#22c55e"/>
  <text x="330" y="219" font-family="-apple-system,BlinkMacSystemFont,sans-serif"
        font-size="15" font-weight="700" fill="#86efac">LiteRT-LM</text>

  <!-- dot -->
  <text x="438" y="219" font-family="-apple-system,sans-serif" font-size="15" fill="#374151">·</text>

  <!-- Apple Silicon badge -->
  <rect x="454" y="196" width="175" height="36" rx="18" fill="#1c0a00" stroke="#c2410c" stroke-width="1.5"/>
  <circle cx="474" cy="214" r="7" fill="#f97316"/>
  <text x="489" y="219" font-family="-apple-system,BlinkMacSystemFont,sans-serif"
        font-size="15" font-weight="700" fill="#fdba74">Apple Silicon GPU</text>

  <!-- Hackathon tag (top right) -->
  <rect x="934" y="14" width="250" height="34" rx="17" fill="#130e2b" stroke="#5b21b6" stroke-width="1.5"/>
  <text x="1059" y="36" font-family="-apple-system,BlinkMacSystemFont,sans-serif"
        font-size="14" font-weight="600" fill="#c4b5fd" text-anchor="middle">Gemma 4 Good Hackathon</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- ARCHITECTURE FLOW -->
  <!-- 4 nodes evenly spaced across full width    -->
  <!-- Node positions:                            -->
  <!--   N1: x=28,  w=198, cx=127                -->
  <!--   N2: x=286, w=230, cx=401                -->
  <!--   N3: x=576, w=230, cx=691  (highlighted) -->
  <!--   N4: x=866, w=198, cx=965               -->
  <!-- ═══════════════════════════════════════════ -->

  <!-- ── ARROW 1: iPhone → Control Plane ───────────────── -->
  <line x1="228" y1="388" x2="280" y2="388"
        stroke="#60a5fa" stroke-width="3" marker-end="url(#arrowBlue)"/>

  <!-- ── ARROW 2: Control Plane → LiteRT ───────────────── -->
  <line x1="518" y1="388" x2="570" y2="388"
        stroke="#a78bfa" stroke-width="3" marker-end="url(#arrowBlue)"/>

  <!-- ── ARROW 3: LiteRT → Tools ────────────────────────── -->
  <line x1="808" y1="388" x2="860" y2="388"
        stroke="#34d399" stroke-width="3" marker-end="url(#arrowGreen)"/>

  <!-- ── RETURN ARC: Tools → iPhone ─────────────────────── -->
  <path d="M 960 488 Q 600 558 140 488"
        stroke="#4ade80" stroke-width="2" stroke-dasharray="7,5" fill="none" opacity="0.6"
        marker-start="url(#arrowReturn)"/>
  <text x="594" y="550" font-family="-apple-system,sans-serif" font-size="14"
        fill="#86efac" text-anchor="middle" opacity="0.75">result returns to phone</text>

  <!-- ══════════════════════════════════════════ -->
  <!-- NODE 1: iPhone App -->
  <!-- ══════════════════════════════════════════ -->
  <rect x="28" y="318" width="198" height="130" rx="14"
        fill="url(#nodeGrad1)" stroke="#3b82f6" stroke-width="2"/>
  <!-- iPhone icon -->
  <rect x="106" y="330" width="28" height="44" rx="5"
        fill="none" stroke="#60a5fa" stroke-width="2"/>
  <rect x="115" y="334" width="10" height="3" rx="1.5" fill="#60a5fa" opacity="0.7"/>
  <rect x="113" y="367" width="14" height="2" rx="1" fill="#60a5fa" opacity="0.5"/>
  <!-- Label -->
  <text x="127" y="388" font-family="-apple-system,BlinkMacSystemFont,sans-serif"
        font-size="16" font-weight="700" fill="#93c5fd" text-anchor="middle">iPhone App</text>
  <text x="127" y="408" font-family="-apple-system,BlinkMacSystemFont,sans-serif"
        font-size="13" fill="#64748b" text-anchor="middle">Kotlin · Compose</text>
  <text x="127" y="425" font-family="-apple-system,BlinkMacSystemFont,sans-serif"
        font-size="13" fill="#64748b" text-anchor="middle">Task Submission</text>
  <text x="127" y="442" font-family="-apple-system,BlinkMacSystemFont,sans-serif"
        font-size="12" fill="#475569" text-anchor="middle">Bonjour Discovery</text>

  <!-- ══════════════════════════════════════════ -->
  <!-- NODE 2: Control Plane -->
  <!-- ══════════════════════════════════════════ -->
  <rect x="286" y="318" width="230" height="130" rx="14"
        fill="url(#nodeGrad2)" stroke="#7c3aed" stroke-width="2"/>
  <text x="401" y="348" font-family="-apple-system,BlinkMacSystemFont,sans-serif"
        font-size="17" font-weight="700" fill="#c4b5fd" text-anchor="middle">Control Plane</text>
  <text x="401" y="368" font-family="-apple-system,BlinkMacSystemFont,sans-serif"
        font-size="13" fill="#8b7ec8" text-anchor="middle">Node.js · TypeScript</text>
  <text x="401" y="388" font-family="-apple-system,BlinkMacSystemFont,sans-serif"
        font-size="13" fill="#6b7280" text-anchor="middle">40 JSON Schemas</text>
  <text x="401" y="406" font-family="-apple-system,BlinkMacSystemFont,sans-serif"
        font-size="13" fill="#6b7280" text-anchor="middle">Event-Sourced State Machine</text>
  <text x="401" y="424" font-family="-apple-system,BlinkMacSystemFont,sans-serif"
        font-size="13" fill="#6b7280" text-anchor="middle">RoutingEngine · SQLite</text>
  <text x="401" y="442" font-family="-apple-system,BlinkMacSystemFont,sans-serif"
        font-size="12" fill="#4b5563" text-anchor="middle">Heartbeat · Handoff</text>

  <!-- ══════════════════════════════════════════ -->
  <!-- NODE 3: LiteRT-LM Engine (HIGHLIGHTED) -->
  <!-- ══════════════════════════════════════════ -->
  <!-- Outer glow ring -->
  <rect x="572" y="302" width="240" height="162" rx="16"
        fill="none" stroke="#22c55e" stroke-width="1" opacity="0.3"/>
  <rect x="574" y="304" width="236" height="158" rx="15"
        fill="url(#nodeGrad3)" stroke="#16a34a" stroke-width="2.5" filter="url(#nodeGlow)"/>
  <text x="692" y="334" font-family="-apple-system,BlinkMacSystemFont,sans-serif"
        font-size="17" font-weight="700" fill="#4ade80" text-anchor="middle">LiteRT-LM Engine</text>
  <!-- Separator line -->
  <line x1="594" y1="342" x2="790" y2="342" stroke="#166534" stroke-width="1" opacity="0.6"/>
  <text x="692" y="360" font-family="-apple-system,BlinkMacSystemFont,sans-serif"
        font-size="14" font-weight="600" fill="#86efac" text-anchor="middle">litert_lm.Backend.GPU</text>
  <text x="692" y="378" font-family="-apple-system,BlinkMacSystemFont,sans-serif"
        font-size="13" fill="#6b7280" text-anchor="middle">Gemma 4 E2B · E4B</text>
  <text x="692" y="395" font-family="-apple-system,BlinkMacSystemFont,sans-serif"
        font-size="13" fill="#6b7280" text-anchor="middle">.litertlm format</text>
  <text x="692" y="412" font-family="-apple-system,BlinkMacSystemFont,sans-serif"
        font-size="13" fill="#6b7280" text-anchor="middle">Metal GPU · Apple Silicon</text>
  <text x="692" y="430" font-family="-apple-system,BlinkMacSystemFont,sans-serif"
        font-size="13" fill="#4ade80" text-anchor="middle">per-Run session isolation</text>
  <text x="692" y="454" font-family="-apple-system,BlinkMacSystemFont,sans-serif"
        font-size="12" fill="#374151" text-anchor="middle">28s cold · 4–6s warm</text>

  <!-- ══════════════════════════════════════════ -->
  <!-- NODE 4: Tool Registry -->
  <!-- ══════════════════════════════════════════ -->
  <rect x="866" y="318" width="198" height="130" rx="14"
        fill="url(#nodeGrad4)" stroke="#ea580c" stroke-width="2"/>
  <text x="965" y="348" font-family="-apple-system,BlinkMacSystemFont,sans-serif"
        font-size="17" font-weight="700" fill="#fb923c" text-anchor="middle">Tool Registry</text>
  <text x="965" y="370" font-family="-apple-system,BlinkMacSystemFont,sans-serif"
        font-size="13" fill="#78503a" text-anchor="middle">file · shell · web fetch</text>
  <text x="965" y="388" font-family="-apple-system,BlinkMacSystemFont,sans-serif"
        font-size="13" fill="#78503a" text-anchor="middle">AppleScript</text>
  <text x="965" y="406" font-family="-apple-system,BlinkMacSystemFont,sans-serif"
        font-size="13" fill="#6b7280" text-anchor="middle">Calendar · Mail</text>
  <text x="965" y="424" font-family="-apple-system,BlinkMacSystemFont,sans-serif"
        font-size="13" fill="#6b7280" text-anchor="middle">Finder · Shell</text>
  <text x="965" y="442" font-family="-apple-system,BlinkMacSystemFont,sans-serif"
        font-size="12" fill="#4b5563" text-anchor="middle">Python · async</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- BOTTOM BADGES -->
  <!-- ═══════════════════════════════════════════ -->

  <!-- Privacy badge -->
  <rect x="28" y="572" width="216" height="42" rx="10"
        fill="#071a0e" stroke="#166534" stroke-width="1.5"/>
  <text x="48" y="588" font-family="-apple-system,sans-serif" font-size="13" font-weight="600" fill="#4ade80">🔒 100% Local</text>
  <text x="48" y="605" font-family="-apple-system,sans-serif" font-size="12" fill="#365314">Zero outbound connections · No API keys</text>

  <!-- LiteRT Special Track badge -->
  <rect x="848" y="572" width="324" height="42" rx="10"
        fill="#0a1628" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="1010" y="588" font-family="-apple-system,sans-serif" font-size="13" font-weight="600" fill="#60a5fa" text-anchor="middle">Google AI Edge · LiteRT</text>
  <text x="1010" y="605" font-family="-apple-system,sans-serif" font-size="12" fill="#1e40af" text-anchor="middle">Special Technology Track</text>

  <!-- Bottom accent bar -->
  <rect x="0" y="626" width="1200" height="4" fill="url(#accentGrad)" opacity="0.6"/>
</svg>

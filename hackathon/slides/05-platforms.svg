  <text x="1076" y="268" font-family="-apple-system,BlinkMacSystemFont,sans-serif"
        font-size="13" fill="#d97706" text-anchor="middle">bash · Node.js · Python</text>
  <line x1="960" y1="282" x2="1192" y2="282" stroke="#431407" stroke-width="1"/>
  <g font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">
    <circle cx="966" cy="305" r="3" fill="#fbbf24"/>
    <text x="979" y="310" fill="#e2e8f0">install.sh  one-line setup</text>
    <circle cx="966" cy="335" r="3" fill="#fbbf24"/>
    <text x="979" y="340" fill="#e2e8f0">start_all.sh  launch services</text>
    <circle cx="966" cy="365" r="3" fill="#fbbf24"/>
    <text x="979" y="370" fill="#e2e8f0">test_all.sh  13 E2E tests</text>
    <circle cx="966" cy="395" r="3" fill="#fbbf24"/>
    <text x="979" y="400" fill="#e2e8f0">eval_e2e.sh  scored eval</text>
    <circle cx="966" cy="425" r="3" fill="#fbbf24"/>
    <text x="979" y="430" fill="#e2e8f0">validate_install.sh</text>
    <circle cx="966" cy="455" r="3" fill="#fbbf24"/>
    <text x="979" y="460" fill="#e2e8f0">Launchd autostart</text>
    <circle cx="966" cy="485" r="3" fill="#fbbf24"/>
    <text x="979" y="490" fill="#e2e8f0">Tailscale remote access</text>
  </g>
  <rect x="960" y="538" width="232" height="52" rx="10" fill="#120c00" stroke="#92400e" stroke-width="1"/>
  <text x="1076" y="560" font-family="-apple-system,BlinkMacSystemFont,sans-serif"
        font-size="12" fill="#fbbf24" text-anchor="middle">19 scripts total</text>
  <text x="1076" y="578" font-family="-apple-system,BlinkMacSystemFont,sans-serif"
        font-size="11" fill="#334155" text-anchor="middle">curl -fsSL ... | bash</text>

  <!-- Center connector line -->
  <line x1="64" y1="643" x2="1216" y2="643" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="640" y="660" font-family="-apple-system,BlinkMacSystemFont,sans-serif"
        font-size="14" font-weight="600" fill="#334155" text-anchor="middle">
    All clients connect to the same Control Plane · Shared event log · Single source of truth
  </text>

  <!-- Footer -->
  <text x="64" y="710" font-family="-apple-system,BlinkMacSystemFont,sans-serif"
        font-size="13" fill="#1e293b">05 / 05</text>
  <text x="1216" y="710" font-family="-apple-system,BlinkMacSystemFont,sans-serif"
        font-size="13" fill="#1e293b" text-anchor="end">EasyCompute · Gemma 4 via LiteRT</text>
  <rect x="0" y="715" width="1280" height="5" fill="url(#line)" opacity="0.4"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#07091a"/>
      <stop offset="100%" style="stop-color:#0c1128"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4285f4"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0808"/>
      <stop offset="100%" style="stop-color:#120606"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#061a0a"/>
      <stop offset="100%" style="stop-color:#041208"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect x="0" y="0" width="1280" height="5" fill="url(#line)"/>

  <!-- Grid -->
  <g opacity="0.035" stroke="#6366f1" stroke-width="0.5">
    <line x1="0" y1="180" x2="1280" y2="180"/>
    <line x1="0" y1="360" x2="1280" y2="360"/>
    <line x1="0" y1="540" x2="1280" y2="540"/>
    <line x1="320" y1="0" x2="320" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="960" y1="0" x2="960" y2="720"/>
  </g>

  <!-- Slide label -->
  <text x="64" y="60" font-family="-apple-system,BlinkMacSystemFont,sans-serif"
        font-size="13" font-weight="600" fill="#334155" letter-spacing="3">THE PROBLEM</text>

  <!-- Title -->
  <text x="64" y="110" font-family="-apple-system,BlinkMacSystemFont,sans-serif"
        font-size="52" font-weight="800" fill="white" letter-spacing="-1">
    Cloud AI makes a choice.
  </text>
  <text x="64" y="162" font-family="-apple-system,BlinkMacSystemFont,sans-serif"
        font-size="52" font-weight="800" letter-spacing="-1">
    <tspan fill="#f87171">Your data leaves your hands.</tspan>
  </text>

  <!-- Divider line -->
  <line x1="64" y1="190" x2="620" y2="190" stroke="#1e293b" stroke-width="1"/>

  <!-- LEFT panel — THE PROBLEM -->
  <rect x="64" y="210" width="530" height="420" rx="16" fill="url(#redGrad)" stroke="#7f1d1d" stroke-width="1.5"/>
  <rect x="64" y="210" width="530" height="50" rx="0" fill="#1a0808"/>
  <rect x="64" y="210" width="530" height="50" rx="16"/>
  <rect x="64" y="236" width="530" height="24" fill="#1a0808"/>
  <text x="340" y="244" font-family="-apple-system,BlinkMacSystemFont,sans-serif"
        font-size="15" font-weight="700" fill="#f87171" text-anchor="middle" letter-spacing="2">CLOUD AI TODAY</text>

  <!-- Problem items -->
  <g font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="16" fill="#94a3b8">
    <!-- item 1 -->
    <rect x="90" y="280" width="8" height="8" rx="2" fill="#ef4444"/>
    <text x="114" y="292" font-size="16" fill="#e2e8f0" font-weight="600">Subscription fees</text>
    <text x="114" y="314" font-size="14" fill="#64748b">$20–$40/month per user, per service</text>

    <!-- item 2 -->
    <rect x="90" y="344" width="8" height="8" rx="2" fill="#ef4444"/>
    <text x="114" y="356" font-size="16" fill="#e2e8f0" font-weight="600">Your queries become training data</text>
    <text x="114" y="378" font-size="14" fill="#64748b">Logged, retained, potentially used for model training</text>

    <!-- item 3 -->
    <rect x="90" y="408" width="8" height="8" rx="2" fill="#ef4444"/>
    <text x="114" y="420" font-size="16" fill="#e2e8f0" font-weight="600">Files must be uploaded to act on them</text>
    <text x="114" y="442" font-size="14" fill="#64748b">Cannot touch local filesystem, calendar, shell</text>

    <!-- item 4 -->
    <rect x="90" y="472" width="8" height="8" rx="2" fill="#ef4444"/>
    <text x="114" y="484" font-size="16" fill="#e2e8f0" font-weight="600">Internet required — always</text>
    <text x="114" y="506" font-size="14" fill="#64748b">Offline = no AI. Regulated industries = blocked.</text>

    <!-- item 5 -->
    <rect x="90" y="536" width="8" height="8" rx="2" fill="#ef4444"/>
    <text x="114" y="548" font-size="16" fill="#e2e8f0" font-weight="600">Trust assumed, not verifiable</text>
    <text x="114" y="570" font-size="14" fill="#64748b">No way to confirm what happens to your data</text>
  </g>

  <!-- Arrow in center -->
  <text x="640" y="415" font-family="-apple-system,BlinkMacSystemFont,sans-serif"
        font-size="42" fill="#334155" text-anchor="middle">→</text>
  <text x="640" y="455" font-family="-apple-system,BlinkMacSystemFont,sans-serif"
        font-size="13" fill="#475569" text-anchor="middle">EasyCompute</text>

  <!-- RIGHT panel — THE SOLUTION -->
  <rect x="686" y="210" width="530" height="420" rx="16" fill="url(#greenGrad)" stroke="#14532d" stroke-width="1.5"/>
  <rect x="686" y="210" width="530" height="50" rx="0" fill="#061a0a"/>
  <rect x="686" y="210" width="530" height="50" rx="16"/>
  <rect x="686" y="236" width="530" height="24" fill="#061a0a"/>
  <text x="951" y="244" font-family="-apple-system,BlinkMacSystemFont,sans-serif"
        font-size="15" font-weight="700" fill="#4ade80" text-anchor="middle" letter-spacing="2">EASYCOMPUTE</text>

  <!-- Solution items -->
  <g font-family="-apple-system,BlinkMacSystemFont,sans-serif">
    <!-- item 1 -->
    <rect x="712" y="280" width="8" height="8" rx="2" fill="#22c55e"/>
    <text x="736" y="292" font-size="16" fill="#e2e8f0" font-weight="600">Zero cost after install</text>
    <text x="736" y="314" font-size="14" fill="#64748b">No subscription. Model runs on your hardware.</text>

    <!-- item 2 -->
    <rect x="712" y="344" width="8" height="8" rx="2" fill="#22c55e"/>
    <text x="736" y="356" font-size="16" fill="#e2e8f0" font-weight="600">Data never leaves your Mac</text>
    <text x="736" y="378" font-size="14" fill="#64748b">Zero outbound traffic. Verifiable with Wireshark.</text>

    <!-- item 3 -->
    <rect x="712" y="408" width="8" height="8" rx="2" fill="#22c55e"/>
    <text x="736" y="420" font-size="16" fill="#e2e8f0" font-weight="600">Full local access — files, shell, Calendar</text>
    <text x="736" y="442" font-size="14" fill="#64748b">Gemma 4 calls real tools on your real machine</text>

    <!-- item 4 -->
    <rect x="712" y="472" width="8" height="8" rx="2" fill="#22c55e"/>
    <text x="736" y="484" font-size="16" fill="#e2e8f0" font-weight="600">Works offline, on your LAN</text>
    <text x="736" y="506" font-size="14" fill="#64748b">Private network only. No internet dependency.</text>

    <!-- item 5 -->
    <rect x="712" y="536" width="8" height="8" rx="2" fill="#22c55e"/>
    <text x="736" y="548" font-size="16" fill="#e2e8f0" font-weight="600">Consent gates for sensitive actions</text>
    <text x="736" y="570" font-size="14" fill="#64748b">ApprovalService: you grant/reject on your phone</text>
  </g>

  <!-- Footer -->
  <text x="64" y="698" font-family="-apple-system,BlinkMacSystemFont,sans-serif"
        font-size="13" fill="#1e293b">02 / 05</text>
  <text x="1216" y="698" font-family="-apple-system,BlinkMacSystemFont,sans-serif"
        font-size="13" fill="#1e293b" text-anchor="end">EasyCompute · Gemma 4 via LiteRT</text>
  <rect x="0" y="715" width="1280" height="5" fill="url(#line)" opacity="0.4"/>
</svg>

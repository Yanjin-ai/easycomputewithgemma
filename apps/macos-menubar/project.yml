name: GemmaMenuBar

options:
  bundleIdPrefix: com.gemma4all
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15"
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_PREVIEWS: "YES"
    ONLY_ACTIVE_ARCH: "NO"
    SKIP_INSTALL: "NO"
  configs:
    Release:
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGNING_REQUIRED: "NO"
      CODE_SIGNING_ALLOWED: "YES"
      DEAD_CODE_STRIPPING: "YES"
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule

targets:
  GemmaMenuBar:
    type: application
    platform: macOS
    deploymentTarget: "13.0"

    sources:
      - path: .
        excludes:
          - "project.yml"
          - "GemmaMenuBar.xcodeproj/**"
          - "GemmaMenuBar.entitlements"
          - "ExportOptions.plist"
          - "**/.DS_Store"

    resources:
      - path: ../../services/control-plane/dist-bin/gemma4all-cp-macos
        optional: true
      - path: ../../services/control-plane/dist-bin/better_sqlite3.node
        optional: true
      - path: ../../services/control-plane/dist-bin/schemas
        optional: true

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gemma4all.GemmaMenuBar
        INFOPLIST_FILE: Info.plist
        PRODUCT_NAME: GemmaMenuBar
        # Signing: Debug uses Automatic (Xcode manages cert);
        # Release uses Manual so CODE_SIGN_IDENTITY="-" (unsigned DMG) works cleanly.
        # When Developer account is available, change Release CODE_SIGN_IDENTITY to
        # "Apple Development" and set DEVELOPMENT_TEAM.
        CODE_SIGN_ENTITLEMENTS: GemmaMenuBar.entitlements
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Manual

    info:
      path: Info.plist
      properties:
        CFBundleVersion: "1"
        CFBundleShortVersionString: "0.1.0"
        LSUIElement: true
        LSMinimumSystemVersion: "13.0"

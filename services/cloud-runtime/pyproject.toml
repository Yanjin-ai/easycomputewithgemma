[project]
name = "cloud-runtime"
version = "0.1.0"
description = "Gemma4all cloud runtime — executes cloud-ok tasks with Gemini"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "google-genai>=1.0",
    "beautifulsoup4>=4.12",
]

[project.scripts]
cloud-runtime = "cloud_runtime.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloud_runtime"]

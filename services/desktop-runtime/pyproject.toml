[project]
name = "desktop-runtime"
version = "0.1.0"
description = "Gemma4all desktop runtime — wraps LiteRT-LM for cross-device task execution"
requires-python = ">=3.11"
dependencies = [
    "litert-lm-api-nightly",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "Pillow>=10.0",
    "anyio>=4.0",
]

[project.scripts]
desktop-runtime = "desktop_runtime.main:main"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-anyio>=0.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/desktop_runtime"]
